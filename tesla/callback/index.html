<!doctype html><meta charset="utf-8"><title>Tesla OAuth callback</title>
<style>body{font-family:system-ui;max-width:640px;margin:3rem auto;padding:0 1rem}
code{background:#f2f2f2;padding:.4rem .6rem;border-radius:6px;display:block;word-break:break-all;margin:.5rem 0}</style>
<h2>Tesla authorization received</h2>
<p>Copy the <b>code</b> below back into the setup session:</p>
<code id="c">(no code in URL)</code>
<script>
const p = new URLSearchParams(location.search);
if (p.get("code")) document.getElementById("c").textContent = p.get("code");
</script>
